name: hw3 CI

on:
  push:
    branches: [main]
    paths:
      - 'hw3/**'
      - '.github/workflows/hw3-ci.yml'
  pull_request:
    paths:
      - 'hw3/**'
      - '.github/workflows/hw3-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: hw3

jobs:
  build:
    name: Build (go build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            hw3/booking-service/go.sum
            hw3/flight-service/go.sum

      - name: Build flight-service
        working-directory: hw3/flight-service
        run: go build ./...

      - name: Build booking-service
        working-directory: hw3/booking-service
        run: go build ./...

  unit:
    name: Unit tests (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            hw3/booking-service/go.sum
            hw3/flight-service/go.sum

      - name: Test flight-service
        working-directory: hw3/flight-service
        run: go test -race -count=1 ./...

      - name: Test booking-service
        working-directory: hw3/booking-service
        run: go test -race -count=1 ./...

  integration:
    name: Integration + E2E (docker compose + pytest)
    runs-on: ubuntu-latest
    needs: [build, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hw3/tests/requirements.txt

      - name: Install Python deps
        run: pip install -r tests/requirements.txt

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          set -e
          echo "::group::Wait for booking-service /metrics"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/metrics > /dev/null; then
              echo "booking-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "booking-service did not come up"
              docker compose ps
              docker compose logs booking-service
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

          echo "::group::Wait for flight-service /metrics"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9091/metrics > /dev/null; then
              echo "flight-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "flight-service did not come up"
              docker compose ps
              docker compose logs flight-service
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Verify Prometheus scraped both targets
        run: |
          # Give Prometheus a couple of scrape cycles to mark targets UP.
          sleep 10
          curl -sf 'http://localhost:9090/api/v1/targets' \
            | python -c "
          import json, sys
          data = json.load(sys.stdin)
          actives = data['data']['activeTargets']
          summary = {t['labels'].get('job'): t['health'] for t in actives}
          print('targets:', summary)
          assert summary.get('booking-service') == 'up', summary
          assert summary.get('flight-service') == 'up', summary
          "

      - name: Run integration + E2E tests
        run: pytest tests/ -v

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-logs.txt 2>&1 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: hw3/docker-logs.txt
          if-no-files-found: ignore

  load-test:
    name: Load test (k6)
    runs-on: ubuntu-latest
    needs: [build, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for booking-service
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/metrics > /dev/null; then
              echo "booking-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "booking-service did not come up"
              docker compose ps
              docker compose logs booking-service
              exit 1
            fi
            sleep 2
          done

      - name: Run k6
        run: |
          mkdir -p k6/out
          docker run --rm --network host \
            -v "$PWD/k6:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6:0.55.0 run \
              --summary-export=out/summary.json \
              script.js

      - name: Show k6 summary
        if: always()
        run: |
          if [ -f k6/out/summary.json ]; then
            python3 -c "
          import json
          s = json.load(open('k6/out/summary.json'))
          m = s['metrics']
          print('p95 duration_ms:', round(m['http_req_duration']['p(95)'], 1))
          print('p99 duration_ms:', round(m['http_req_duration']['p(99)'], 1))
          print('error rate:',      round(m['http_req_failed']['value'] * 100, 3), '%')
          print('checks rate:',     round(m['checks']['value'] * 100, 3), '%')
          print('requests total:',  int(m['http_reqs']['count']))
          "
          fi

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-logs.txt 2>&1 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: hw3/k6/out/summary.json
          if-no-files-found: ignore

      - name: Upload load-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-docker-logs
          path: hw3/docker-logs.txt
          if-no-files-found: ignore
