name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (go build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            booking-service/go.sum
            flight-service/go.sum

      - name: Build flight-service
        working-directory: flight-service
        run: go build ./...

      - name: Build booking-service
        working-directory: booking-service
        run: go build ./...

  unit:
    name: Unit tests (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            booking-service/go.sum
            flight-service/go.sum

      - name: Test flight-service
        working-directory: flight-service
        run: go test -race -count=1 ./...

      - name: Test booking-service
        working-directory: booking-service
        run: go test -race -count=1 ./...

  integration:
    name: Integration + E2E (docker compose + pytest)
    runs-on: ubuntu-latest
    needs: [build, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python deps
        run: pip install -r tests/requirements.txt

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          set -e
          echo "::group::Wait for booking-service /metrics"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/metrics > /dev/null; then
              echo "booking-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "booking-service did not come up"
              docker compose ps
              docker compose logs booking-service
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

          echo "::group::Wait for flight-service /metrics"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9091/metrics > /dev/null; then
              echo "flight-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "flight-service did not come up"
              docker compose ps
              docker compose logs flight-service
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

      - name: Verify Prometheus scraped both targets
        run: |
          # Give Prometheus a couple of scrape cycles to mark targets UP.
          sleep 10
          curl -sf 'http://localhost:9090/api/v1/targets' \
            | python -c "
          import json, sys
          data = json.load(sys.stdin)
          actives = data['data']['activeTargets']
          summary = {t['labels'].get('job'): t['health'] for t in actives}
          print('targets:', summary)
          assert summary.get('booking-service') == 'up', summary
          assert summary.get('flight-service') == 'up', summary
          "

      - name: Run integration + E2E tests
        run: pytest tests/ -v

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-logs.txt 2>&1 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt
          if-no-files-found: ignore

  load-test:
    name: Load test (k6)
    runs-on: ubuntu-latest
    needs: [build, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for booking-service
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/metrics > /dev/null; then
              echo "booking-service ready after ${i} attempts"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "booking-service did not come up"
              docker compose ps
              docker compose logs booking-service
              exit 1
            fi
            sleep 2
          done

      # 压测航班不在迁移里（它是测试装置，不是系统的一部分）——见 k6/loadtest-seed.sql。
      - name: Seed load-test flights
        run: make loadtest-seed

      # CI 上只跑 steady 场景，且刻意降速降标准。
      #
      # 这不是门禁：runner 是 2–4 核、要同时跑 13 个容器，与开发机差一个数量级，
      # 它判不了容量（docs/conventions/testing.md § 6）。这一步只回答
      # 「跑得起来、没崩、没有数量级退化」。
      #
      # RATE=50 / P95_MS=500 与改造前的口径**完全一致**（改造前是 10 VU +
      # sleep(0.1) ≈ 90 req/s、p95<500），没有放宽任何既有阈值。
      # 本机跑 steady 用脚本默认值：500 QPS、p95<50ms，那才是 R2 的真实要求。
      #
      # read / write 两个阶梯场景**不在 CI 里跑** —— 开环阶梯会把 runner 打死，
      # 而且结论无效。它们只在开发机跑，产出进 docs/reports/load/（T-07）。
      - name: Run k6 (smoke, steady scenario)
        run: |
          mkdir -p k6/out
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/k6:/scripts" \
            -w /scripts \
            -e BASE_URL=http://localhost:8080 \
            -e RUN_NAME=ci-smoke \
            -e SCENARIO=steady \
            -e RATE=50 \
            -e P95_MS=500 \
            grafana/k6:0.55.0 run script.js

      - name: Show k6 summary
        if: always()
        run: |
          if [ -f k6/out/ci-smoke.summary.json ]; then
            python3 -c "
          import json
          m = json.load(open('k6/out/ci-smoke.summary.json'))['metrics']
          print('p95 duration_ms:', round(m['http_req_duration']['values']['p(95)'], 1))
          print('p99 duration_ms:', round(m['http_req_duration']['values']['p(99)'], 1))
          print('error rate (409 排除):', round(m['http_req_failed']['values']['rate'] * 100, 3), '%')
          print('checks rate:',     round(m['checks']['values']['rate'] * 100, 3), '%')
          print('requests total:',  int(m['http_reqs']['values']['count']))
          "
          fi

      - name: Verify SLO thresholds against Prometheus (题 8)
        run: python3 scripts/verify_metrics.py

      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: metrics-report.json
          if-no-files-found: ignore

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-logs.txt 2>&1 || true

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6/out/ci-smoke.summary.json
          if-no-files-found: ignore

      - name: Upload load-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-docker-logs
          path: docker-logs.txt
          if-no-files-found: ignore
