services:
  # ---- Databases ----
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight_db
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight_pass
    ports:
      - "5433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  # ---- Redis Sentinel (题9) ----
  redis-master:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis-slave:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis-sentinel:
    image: redis:7-alpine
    command: >
      sh -c '
      echo "sentinel resolve-hostnames yes" > /tmp/sentinel.conf &&
      echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf &&
      echo "sentinel monitor mymaster redis-master 6379 1" >> /tmp/sentinel.conf &&
      echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf &&
      echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf &&
      echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      '
    depends_on:
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # ---- Flight Service ----
  flight-service:
    build: ./flight-service
    environment:
      GRPC_PORT: "50051"
      METRICS_PORT: "9091"
      DB_HOST: flight-db
      DB_PORT: "5432"
      DB_USER: flight
      DB_PASSWORD: flight_pass
      DB_NAME: flight_db
      REDIS_SENTINEL_ADDR: redis-sentinel:26379
      REDIS_MASTER_NAME: mymaster
      AUTH_API_KEY: "super-secret-key"  # 题6: 服务间认证
    ports:
      - "50051:50051"
      - "9091:9091"
    depends_on:
      flight-db:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy

  # ---- Booking Service ----
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      HTTP_PORT: "8080"
      DB_HOST: booking-db
      DB_PORT: "5432"
      DB_USER: booking
      DB_PASSWORD: booking_pass
      DB_NAME: booking_db
      FLIGHT_SERVICE_ADDR: flight-service:50051
      AUTH_API_KEY: "super-secret-key"  # 题6: 与 flight-service 一致
      # 题10: 熔断器参数
      CB_ERROR_THRESHOLD: "5"
      CB_TIMEOUT_SECONDS: "30"
      CB_WINDOW_SECONDS: "60"
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started

  # ---- Infrastructure exporters (题6) ----
  postgres-exporter-booking:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://booking:booking_pass@booking-db:5432/booking_db?sslmode=disable"
    depends_on:
      booking-db:
        condition: service_healthy

  postgres-exporter-flight:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://flight:flight_pass@flight-db:5432/flight_db?sslmode=disable"
    depends_on:
      flight-db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis-master:6379
    depends_on:
      redis-master:
        condition: service_healthy

  # ---- Prometheus (题4) ----
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
    ports:
      - "9090:9090"
    depends_on:
      - booking-service
      - flight-service

  # ---- Grafana (题5, 题6) ----
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  flight-db-data:
  booking-db-data:
